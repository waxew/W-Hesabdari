name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: android-ci-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Debug
        run: gradle clean assembleDebug --stacktrace

      - name: Package Debug APK
        if: success()
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/*.apk build-artifacts/W-Hesabdari-v1.0.0-debug.apk
          sha256sum build-artifacts/W-Hesabdari-v1.0.0-debug.apk > build-artifacts/W-Hesabdari-v1.0.0-debug.sha256

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W-Hesabdari-v1.0.0-debug
          path: build-artifacts/
          if-no-files-found: error
